nodeLinker: node-modules

npmRegistryServer: 'https://registry.npmjs.org/'

# Keep third-party install scripts disabled by default. Native dependencies that need
# builds must be explicitly allowlisted with dependenciesMeta.built: true.
enableScripts: false

# Yarn 4.17+ default is 1d (1440m); keep a short gate without blocking fresh publishes.
npmMinimalAgeGate: 4h

yarnPath: .yarn/releases/yarn-4.17.1.cjs
